name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      # The frozen snapshot is versioned, so the real-data tests run here without network.
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo test --release --locked
      # The binary carries its data: exercise it outside the checkout.
      - run: |
          smoke="$RUNNER_TEMP/smoke" && mkdir -p "$smoke"
          cp target/release/srl* examples/canned.csv "$smoke/"
          cd "$smoke"
          ./srl build --basket canned.csv --k 1 -o basket.json
          ./srl solve basket.json -o solution.json
          ./srl enum basket.json -o family.json
          ./srl verify family.json | tee verify.json
          grep -q '"panels": 1284' verify.json && grep -q '"exhaustion": "complete"' verify.json
          ./srl --snapshot QBL-2025-06-20.xlsx audit > prior.json
          ./srl entities --seeds 1 > entities.json
          ./srl gaps --seeds 1 > gaps.json
      - uses: actions/upload-artifact@v4
        with:
          name: srl-${{ matrix.os }}
          path: target/release/srl${{ matrix.os == 'windows-latest' && '.exe' || '' }}
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: node --check site/app.js
      - run: python analysis/check_browser.py
      - run: python analysis/check_evidence.py
